<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Movie Visualization Hub</title> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="https://unpkg.com/d3-simple-slider"></script>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>

        <div class="title-container">
            <h1 class="title">The Hidden Statistics of Hollywood</h1>
            <h2 class="subtitle">A Interactive Exploration of Films Throughout History</h2>
            <h3 class="authors">By: Ritwik Behera, Neil Deng, Richard Gancayco, Merliss George, and Bill Zhou</h3>
        </div>

        <h1>Movie Visualization Hub</h1> 

        <div class="center-wrapper">
            <div id="controls" class="card">
                <div class="form-group">
                    <label for="directorSearch">Director Name</label>
                    <input type="text" id="directorSearch" placeholder="e.g. Nolan" />
                    
                    <label for="titleSearch">Movie Title</label>
                    <input type="text" id="titleSearch" placeholder="e.g. Inception" />

                    <label for="y-axis-select">Y-Axis</label>
                    <select id="y-axis-select">
                        <option value="count">Count</option>
                        <option value="rating">Rating</option>
                        <option value="boxoffice">Box Office</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Genre</label>
                    <div id="genreCheckboxes" class="genre-checkboxes"></div>
                        <div class="genre-buttons">
                        <button id="selectAllGenresBtn">Select All</button>
                        <button id="clearGenresBtn">Clear All</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Graph</label>
                    <button id="tab-dotplot" class="tab-button active">Dot Plot</button>
                    <button id="tab-streamgraph" class="tab-button">Streamgraph</button>
                </div>

                <div class="form-group">
                    <label>Year Range</label>
                    <div id="yearSlider" class="slider-track"></div>

                    <label>Rating Range</label>
                    <div id="ratingSlider" class="slider-track"></div>
                </div>

            </div>
            
            <div class="legend-container" id="legend"></div>

        </div>

        <div id="vis" class="vis-box"></div>
        <div id="streamgraph-vis-container" class="vis-box hidden"></div>
        <div id="legend-and-stats">          
            <div id="stats"></div>
            <div></div>
        </div>

        <div id="tooltip" class="tooltip"></div>

        <script src="js/script.js"></script>
    </body>
</html>
